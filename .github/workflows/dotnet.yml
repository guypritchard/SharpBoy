name: Windows emulator build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.semVer }}
    steps:
      - name: Checkout full history for GitVersion
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.x

      - name: Calculate version
        id: version
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Setup Python for independent ROM validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned PyBoy in an isolated environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = Join-Path $env:RUNNER_TEMP 'sharpboy-pyboy-venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Python venv creation failed' }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install -r Tools/IndependentEmulator/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'PyBoy requirements installation failed' }
          & $python -c 'import importlib.metadata as m; import pyboy; version = m.version("pyboy"); assert version == "2.6.0", f"Unexpected PyBoy version: {version}"; print("PyBoy 2.6.0 imported")'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned PyBoy import/version check failed' }
          "GB_PYBOY_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify official RGBDS 0.9.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'rgbds-0.9.0-win64.zip'
          $root = Join-Path $env:RUNNER_TEMP 'sharpboy-rgbds-0.9.0'
          Invoke-WebRequest -Uri 'https://github.com/gbdev/rgbds/releases/download/v0.9.0/rgbds-0.9.0-win64.zip' -OutFile $archive
          $expected = '6EEE196CAD54DB55D392012684D11C3FE08DDCEE34284D21B792DD6644F3B51A'
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "RGBDS archive SHA-256 mismatch: $actual" }
          Expand-Archive -Path $archive -DestinationPath $root
          $candidates = @(Get-ChildItem -Path $root -Filter rgbasm.exe -File -Recurse | Where-Object {
            (Test-Path -Path (Join-Path $_.DirectoryName 'rgblink.exe') -PathType Leaf) -and
            (Test-Path -Path (Join-Path $_.DirectoryName 'rgbfix.exe') -PathType Leaf)
          } | ForEach-Object { $_.DirectoryName })
          if ($candidates.Count -ne 1) { throw "Expected exactly one complete RGBDS binary directory; found $($candidates.Count)" }
          $bin = $candidates[0]
          foreach ($tool in @('rgbasm', 'rgblink', 'rgbfix')) {
            $reported = & (Join-Path $bin "$tool.exe") --version
            if ($LASTEXITCODE -ne 0 -or @($reported).Count -ne 1 -or $reported -cne "$tool v0.9.0") {
              throw "Unexpected $tool version: $reported"
            }
          }
          "GB_RGBDS_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and test
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.semVer }}
          ASSEMBLY_VERSION: ${{ steps.version.outputs.assemblySemVer }}
          FILE_VERSION: ${{ steps.version.outputs.assemblySemFileVer }}
          INFORMATIONAL_VERSION: ${{ steps.version.outputs.informationalVersion }}
        run: |
          $versionArgs = @(
            "-p:Version=$env:BUILD_VERSION"
            "-p:AssemblyVersion=$env:ASSEMBLY_VERSION"
            "-p:FileVersion=$env:FILE_VERSION"
            "-p:InformationalVersion=$env:INFORMATIONAL_VERSION"
            '-p:IncludeSourceRevisionInInformationalVersion=false'
          )
          dotnet restore GB.Emulator.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build GB.Emulator.sln -c Release --no-restore @versionArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $results = 'artifacts/ci/test-results'
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          dotnet test GB.Compiler.Tests/GB.Compiler.Tests.csproj -c Release --no-build @versionArgs --logger 'trx;LogFileName=compiler.trx' --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & Tools/ci/Assert-TrxNoSkipped.ps1 (Join-Path $results 'compiler.trx')
          dotnet test GB.Emulator.Tests/GB.Emulator.Tests.csproj -c Release --no-build @versionArgs --logger 'trx;LogFileName=emulator.trx' --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & Tools/ci/Assert-TrxNoSkipped.ps1 (Join-Path $results 'emulator.trx')
          dotnet test GB.Emulator.Hosting.Tests/GB.Emulator.Hosting.Tests.csproj -c Release --no-build @versionArgs --logger 'trx;LogFileName=hosting.trx' --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & Tools/ci/Assert-TrxNoSkipped.ps1 (Join-Path $results 'hosting.trx')
          dotnet test GB.Emulator.Windows.Tests/GB.Emulator.Windows.Tests.csproj -c Release --no-build @versionArgs --logger 'trx;LogFileName=windows.trx' --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & Tools/ci/Assert-TrxNoSkipped.ps1 (Join-Path $results 'windows.trx')
          dotnet test GB.Experiments.Windows.Tests/GB.Experiments.Windows.Tests.csproj -c Release --no-build @versionArgs --logger 'trx;LogFileName=experiments-windows.trx' --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & Tools/ci/Assert-TrxNoSkipped.ps1 (Join-Path $results 'experiments-windows.trx')

      - name: Verify distributed Life over real SSH transport
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = Join-Path $env:RUNNER_TEMP 'sharpboy-life-ssh-venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install -r Tools/LifeCluster/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python Tools/LifeCluster/ssh_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-build C# scrolling background ROM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'artifacts/ci/scrolling'
          dotnet run --project GB.Compiler.Cli/GB.Compiler.Cli.csproj -c Release --no-build -- --rgbds-bin $env:GB_RGBDS_BIN --out "$base.gb" --title SCROLLING --background-tiles Samples/Assets/background.2bpp --background-map Samples/Assets/background.tilemap Samples/ScrollingBackground/ScrollingBackground.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($suffix in @('.gb', '.asm', '.map', '.sym', '.memory.txt')) {
            if (-not (Test-Path -Path "$base$suffix" -PathType Leaf)) { throw "Missing sample output $base$suffix" }
          }
          if ((Get-Item -Path "$base.gb").Length -ne 32768) { throw 'Scrolling ROM is not 32768 bytes' }

      - name: Publish Windows applications
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.semVer }}
          ASSEMBLY_VERSION: ${{ steps.version.outputs.assemblySemVer }}
          FILE_VERSION: ${{ steps.version.outputs.assemblySemFileVer }}
          INFORMATIONAL_VERSION: ${{ steps.version.outputs.informationalVersion }}
        run: |
          $versionArgs = @(
            "-p:Version=$env:BUILD_VERSION"
            "-p:AssemblyVersion=$env:ASSEMBLY_VERSION"
            "-p:FileVersion=$env:FILE_VERSION"
            "-p:InformationalVersion=$env:INFORMATIONAL_VERSION"
            '-p:IncludeSourceRevisionInInformationalVersion=false'
          )
          foreach ($runtime in @('win-x64', 'win-arm64')) {
            dotnet publish GB.Emulator.Windows/GB.Emulator.Windows.csproj -c Release -r $runtime --self-contained true -o "artifacts/windows/$runtime" @versionArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet publish GB.Experiments.Windows/GB.Experiments.Windows.csproj -c Release -r $runtime --self-contained true -o "artifacts/experiments-windows/$runtime" @versionArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet publish GB.Emulator.Console/GB.Emulator.Console.csproj -c Release -r $runtime --self-contained true -o "artifacts/console/$runtime" @versionArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet publish GB.Debugger/GB.Debugger.csproj -c Release -r $runtime --self-contained true -o "artifacts/debugger/$runtime" @versionArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload Windows player
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.version.outputs.semVer }}-windows
          path: artifacts/windows/
          if-no-files-found: error

      - name: Upload Windows experiments
        uses: actions/upload-artifact@v4
        with:
          name: experiments-windows-${{ steps.version.outputs.semVer }}-windows
          path: artifacts/experiments-windows/
          if-no-files-found: error

      - name: Upload console emulator
        uses: actions/upload-artifact@v4
        with:
          name: console-${{ steps.version.outputs.semVer }}-windows
          path: artifacts/console/
          if-no-files-found: error

      - name: Upload debugger
        uses: actions/upload-artifact@v4
        with:
          name: debugger-${{ steps.version.outputs.semVer }}-windows
          path: artifacts/debugger/
          if-no-files-found: error

  release:
    name: Release Windows applications
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows player
        uses: actions/download-artifact@v4
        with:
          name: windows-${{ needs.build.outputs.version }}-windows
          path: artifacts/windows/

      - name: Download Windows experiments
        uses: actions/download-artifact@v4
        with:
          name: experiments-windows-${{ needs.build.outputs.version }}-windows
          path: artifacts/experiments-windows/

      - name: Download console emulator
        uses: actions/download-artifact@v4
        with:
          name: console-${{ needs.build.outputs.version }}-windows
          path: artifacts/console/

      - name: Download debugger
        uses: actions/download-artifact@v4
        with:
          name: debugger-${{ needs.build.outputs.version }}-windows
          path: artifacts/debugger/

      - name: Package release assets
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          foreach ($app in @('windows', 'experiments-windows', 'console', 'debugger')) {
            foreach ($runtime in @('win-x64', 'win-arm64')) {
              Compress-Archive -Path "artifacts/$app/$runtime/*" -DestinationPath "release-assets/$app-$env:BUILD_VERSION-$runtime.zip"
            }
          }

      - name: Create GitHub release from commit message
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          $env:RELEASE_NOTES | Set-Content -Path release-notes.md -Encoding utf8
          $assets = Get-ChildItem -Path release-assets/*.zip | ForEach-Object { $_.FullName }
          gh release create "v$env:BUILD_VERSION" @assets --target $env:RELEASE_COMMIT --title "v$env:BUILD_VERSION" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
